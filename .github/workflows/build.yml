name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leashall-projet
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: |
          echo 25 > .java-version
          chmod +x gradlew
          ./gradlew assemble --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: leashall-jar
          path: leashall-projet/build/libs/*.jar
